set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# --- windows (tabs) ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on   # no gaps after closing a tab

bind -n M-t new-window
bind -n M-w confirm-before -p "kill window? (y/n)" kill-window
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-, command-prompt -I "#W" "rename-window '%%'"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# --- IDE-ish look: tabs on top ---
set -g status-position top
set -g status-justify left

# palette: fuzzy jump to any window in any session (Opt-p)
bind -n M-p display-popup -E -w 70% -h 60% \
  "tmux list-windows -a -F '#S:#I|#W|#{pane_current_command}|#{pane_current_path}' \
   | column -t -s '|' \
   | fzf --reverse --prompt='window> ' \
   | cut -d' ' -f1 \
   | xargs -r tmux switch-client -t"

# scratch shell popup (Opt-g), like an IDE terminal drawer
bind -n M-g display-popup -E -w 80% -h 70% -d "#{pane_current_path}"

# cheat sheet: popup, and toggleable right-hand pane
bind -n M-? display-popup -E -w 50 -h 90% "less -R ~/.config/tmux/cheatsheet.txt"
bind -n M-\\ run-shell ~/.config/tmux/cheat-toggle.sh

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'roosta/tmux-fuzzback'
set -g @plugin 'fcsonline/tmux-thumbs'

# fuzzback on prefix+/ so prefix+? stays list-keys
set -g @fuzzback-bind /
# thumbs on prefix+F so prefix+space stays next-layout
set -g @thumbs-key F
set -g @thumbs-reverse enabled
set -g @thumbs-unique enabled
set -g @fzf-url-fzf-options '-w 60% -h 40% --multi --reverse'

# tokyo-night MUST stay last: it overwrites status-right
set -g @plugin 'fabioluciano/tmux-tokyo-night'


set -g @resurrect-capture-pane-contents 'on'
# manual only: C-a C-s saves, C-a C-r restores

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
